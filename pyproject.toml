[project]
name = "ares-agentic-runtime"
version = "0.0.1"
description = "Open-source agentic runtime for monitoring, diagnosing, and safely operating engineering systems."
readme = "README.md"
authors = [
    { name = "Diogo Barros", email = "149416197+Rawerinno@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.407,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ares --cov-report=term-missing --cov-fail-under=90"
