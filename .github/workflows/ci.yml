
name: ARES CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Type checking
        run: uv run --frozen pyright

      - name: Tests and coverage
        run: uv run --frozen pytest

      - name: Offline release acceptance (simulated, no Ollama or devices)
        run: uv run --frozen python -m ares.evaluation.release_acceptance --output ares-release-acceptance.json

      - name: Verify offline release report invariants
        run: uv run --frozen python -m ares.evaluation.verify_release_report ares-release-acceptance.json

      - name: Build package
        run: uv build

      - name: Record exact-commit acceptance provenance
        shell: bash
        run: |
          uv run --frozen python -c 'import hashlib, json, os, pathlib; p = pathlib.Path("ares-release-acceptance.json"); m = {"commit_sha": os.environ["GITHUB_SHA"], "event": os.environ["GITHUB_EVENT_NAME"], "runner_os": os.environ["RUNNER_OS"], "report_sha256": hashlib.sha256(p.read_bytes()).hexdigest(), "report_file": p.name}; pathlib.Path("ares-acceptance-provenance.json").write_text(json.dumps(m, indent=2, sort_keys=True) + "\n", encoding="utf-8")'

      - name: Preserve verified offline acceptance report and provenance
        uses: actions/upload-artifact@v4
        with:
          name: offline-acceptance-${{ matrix.os }}
          path: |
            ares-release-acceptance.json
            ares-acceptance-provenance.json
          if-no-files-found: error
          retention-days: 14
